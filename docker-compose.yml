services:
  app:
    build: .
    container_name: nutritrace-app
    ports:
      - "8088:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8088
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nutritrace
      DB_USERNAME: nutritrace
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: nutritrace-db
    environment:
      MYSQL_DATABASE: nutritrace
      MYSQL_USER: nutritrace
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - nutritrace_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Jenkins CI/CD — ouvrir depuis Docker Desktop ou http://127.0.0.1:8090
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: nutritrace-jenkins
    ports:
      - "8090:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./jenkins/init.groovy.d:/usr/share/jenkins/ref/init.groovy.d:ro
      - .:/workspace/nutritrace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  nutritrace_db:
  jenkins_home:
